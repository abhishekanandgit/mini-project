            <li>Legislative Department, Ministry of Law and Justice, Govt. of India – <em>Indian Penal Code (IPC), Bharatiya Nyaya Sanhita (BNS), CrPC, BNSS, CPC</em></li>
            <li>Google Gemini AI API Developer Documentation – <a href="https://ai.google.dev/" target="_blank" class="text-info">https://ai.google.dev/</a></li>
            <li>Bootstrap 5 & Icons Documentation – <a href="https://getbootstrap.com/" target="_blank" class="text-info">https://getbootstrap.com/</a></li>
            <li>Git & GitHub Source Control Reference – <a href="https://git-scm.com/" target="_blank" class="text-info">https://git-scm.com/</a></li>
          </ul>
        `
      }
    ];

    let currentSlide = 0;

    function renderSlide() {
      const slide = slides[currentSlide];
      const html = `
        <div>
          <div class="slide-number">Slide ${currentSlide + 1} of ${slides.length}</div>
          <h2 class="slide-title">${slide.title}</h2>
          ${slide.subtitle ? `<h5 class="text-info mb-4">${slide.subtitle}</h5>` : ''}
          <div>${slide.content}</div>
        </div>
      `;
      document.getElementById('slideContent').innerHTML = html;
      document.getElementById('slideCounter').innerText = `Slide ${currentSlide + 1} of ${slides.length}`;
      document.getElementById('prevBtn').disabled = (currentSlide === 0);
      document.getElementById('nextBtn').disabled = (currentSlide === slides.length - 1);
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'ArrowRight') nextSlide();
    });

    renderSlide();
  </script>
</body>
</html>
